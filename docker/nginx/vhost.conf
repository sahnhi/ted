listen 8080;

gzip on;
gzip_types text/plain text/css  application/javascript application/xml application/json application/ld+json;
gzip_vary on;
gzip_comp_level 5;
gzip_proxied any;
gzip_min_length 1000;

set $ssl off;
if ($server_port = 8080) {
    set $ssl on;
}

client_body_buffer_size 10K;
client_header_buffer_size 1k;
# Maximum number and size of buffers for large client headers.
# A request line cannot exceed the size of one buffer, or the 414 (Request-URI Too Large) error is returned to the client.
large_client_header_buffers 4 8k;

location /_healthcheck {
    return 200;
}
