[program:worker-mailer]
autorestart=true
autostart=true
command=php /app/bin/console messenger:consume mail -vvv --time-limit=3600 --memory-limit=1024M
numprocs=2
priority=15
process_name=%(program_name)s_%(process_num)02d
redirect_stderr=true
startretries=10
startsecs=0
stdout_logfile_maxbytes=0
stdout_logfile=/dev/stdout

