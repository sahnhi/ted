services:
    db:
        container_name: db
        image: mysql:5.7
        env_file:
            - app/.env
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-nopassword}
        volumes:
            - ./.data/db:/var/lib/mysql
        ports:
            - "3306:3306"

    php-nginx:
        container_name: php-nginx
        build:
            context: .
            dockerfile: Dockerfile
            target: php-dev
        environment:
            APP_ENV: dev
            XDEBUG_MODE: "${XDEBUG_MODE:-off}"
        depends_on:
            - db
        volumes:
            - ./app:/app:rw,cached
            - ./app/public:/app/public:rw,delegated
            - public-media:/app/public/media:rw
            - ./app/client_credentials.json:/app/client_credentials.json:ro
        extra_hosts:
            - host.docker.internal:host-gateway
        user: "${UID:-1000}:${GID:-1000}"
        ports:
            - "80:80"

    nodejs:
        container_name: nodejs
        build:
            context: .
            dockerfile: docker/Dockerfile
        depends_on:
            - php-nginx
        environment:
            - GULP_ENV=dev
            - PHP_HOST=php-nginx
            - PHP_PORT=80
        volumes:
            - ./app:/app:rw,cached
            - ./app/public:/app/public:rw,delegated
        ports:
            - "35729:35729"

    redis:
        container_name: redis
        image: redis
        restart: on-failure
        ports:
            - "6379:6379"
        volumes:
            - redis:/data
    
    ngrok:
        container_name: ngrok
        image: wernight/ngrok:latest
        depends_on:
            - php-nginx
        env_file:
            - app/.env.local
        environment:
            NGROK_PROTOCOL: http
            NGROK_PORT: php-nginx:80
        ports:
            - "4040:4040"
        profiles:
            - debug

    terraform:
        container_name: terraform
        image: hashicorp/terraform:1.3.6
        environment:
            - GOOGLE_APPLICATION_CREDENTIALS=/app/gcloud-service-key.json
        volumes:
            - ./terraform:/app/terraform
            - ~/.config/gcloud/application_default_credentials.json:/app/gcloud-service-key.json:ro
        working_dir: /app/terraform/scheduled-jobs
        profiles:
            - deploy

volumes:
    db:
    redis:
    public-media:
