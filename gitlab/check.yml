php-cs:
    <<: *check_template
    script: vendor/bin/ecs --no-progress-bar
    rules:
        -   if: $CI_PIPELINE_SOURCE == 'merge_request_event'
        -   if: $CI_COMMIT_TAG

unit:
    <<: *check_template
    coverage: '/^\s*Lines:\s*\d+.\d+\%/'
    script:
        - XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-php coverage/unit.cov --colors=never --testsuite unit
    variables:
        APP_ENV: 'test'
    artifacts:
        when: always
        reports:
            junit: app/junit.xml
        paths:
            - app/coverage/unit.cov
    rules:
        -   if: $CI_PIPELINE_SOURCE == 'merge_request_event'
        -   if: $CI_COMMIT_TAG

phpstan:
    <<: *check_template
    script:
        - vendor/bin/phpstan analyse -c phpstan.neon --no-progress --no-interaction --no-ansi
    rules:
        -   if: $CI_PIPELINE_SOURCE == 'merge_request_event'
        -   if: $CI_COMMIT_TAG

lint:
    <<: *check_template
    script: find src/ -type f -name '*.php' -exec php -l {} \; | (! grep -v "No syntax errors detected")
    rules:
        -   if: $CI_PIPELINE_SOURCE == 'merge_request_event'
        -   if: $CI_COMMIT_TAG

composer:
    <<: *check_template
    script:
        - $(which composer) validate --strict

composer-normalize:
    <<: *check_template
    script:
        - $(which composer) normalize --dry-run

rector:
    <<: *check_template
    cache:
        key: "rector-cache"
        paths:
            - /app/var/rector
        policy: pull-push
    script:
        - vendor/bin/rector process --dry-run --no-progress-bar --ansi
    rules:
        -   if: $CI_PIPELINE_SOURCE == 'merge_request_event'
        -   if: $CI_COMMIT_TAG

architecture:
    <<: *check_template
    script:
        - vendor/bin/phparkitect check
    rules:
        -   if: $CI_PIPELINE_SOURCE == 'merge_request_event'
        -   if: $CI_COMMIT_TAG
