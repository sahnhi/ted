include:
    - local: '/gitlab/templates.yml'

##### STAGE CHECK #####
.check_template: &check_template
    stage: check
    image:
        name: $CI_REGISTRY_IMAGE/php:latest
        pull_policy: always
    environment: test
    needs:
        - vendor-dev
    before_script:
        - !reference [.load_environment_variables]
        - export GOOGLE_SERVICE_ACCOUNT_CREDENTIAL_FILE=/app/config/client_credentials.json
        - cd app
    interruptible: true
    cache:
        paths:
            - app/vendor/
            - $COMPOSER_CACHE_DIR

functional:
    <<: *check_template
    coverage: '/^\s*Lines:\s*\d+.\d+\%/'
    services:
        - name: mysql:5.7
          alias: db
        - name: redis:latest
          alias: redis
    allow_failure: true
    variables:
        MYSQL_DRIVER: 'pdo_mysql'
        MYSQL_PORT: '3306'
        MYSQL_USER: 'tediber'
        MYSQL_ROOT_PASSWORD: 'nopassword'
        MYSQL_DATABASE: 'tediber'
        MYSQL_PASSWORD: 'secret'
    script:
        - bin/console doctrine:database:create
        - bin/console doctrine:schema:create
        - XDEBUG_MODE=coverage vendor/bin/phpunit --verbose --coverage-php coverage/functional.cov --colors=never --testsuite functional
    artifacts:
        when: always
        reports:
            junit: app/junit.xml
        paths:
            - app/coverage/functional.cov
    rules:
        -   if: $CI_PIPELINE_SOURCE == 'merge_request_event'
        -   if: $CI_COMMIT_TAG
