monolog:
    handlers:
        main:
            type: fingers_crossed
            action_level: error
            formatter: monolog.formatter.json
            handler: nested
            channels: [ "!event", "!console" ]
            excluded_http_codes: [ 404 ]
        nested:
            type: stream
            path: "php://stdout"
            level: debug
        deprecation:
            type: stream
            path: /dev/null
        google:
            type: service
            id: app.google.logger
            channels: [ "odoo", "routing", "rimdian", "googleshopping" ]
