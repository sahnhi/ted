monolog:
    handlers:
        main:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            level: debug
            channels: [ "!event", "!odoo", "!rimdian", "!googleshopping" ]
        error:
            type: stream
            path: "%kernel.logs_dir%/error.log"
            level: error
            channels: [ "!event" ]
        console:
            type: console
            process_psr_3_messages: false
            channels: [ "!event", "!doctrine", "!console" ]
        odoo:
            type: stream
            path: "%kernel.logs_dir%/odoo.log"
            channels: [ "odoo" ]
        rimdian:
            type: stream
            path: "%kernel.logs_dir%/rimdian.log"
            channels: [ "rimdian" ]
        googleshopping:
            type: stream
            path: "%kernel.logs_dir%/googleshopping.log"
            channels: [ "googleshopping" ]
