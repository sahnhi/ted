sentry:
    dsn: '%env(SENTRY_DSN)%'
    messenger:
        enabled: true
        capture_soft_fails: false # Exclude retryable errors
    options:
        environment: '%env(SENTRY_ENV)%'
        error_types: "E_ALL & ~E_WARNING & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED"
        profiles_sample_rate: '%env(float:SENTRY_PROFILE_SAMPLE_RATE)%'
        traces_sampler: 'sentry.callback.traces_sampler'
        ignore_exceptions:
            # Vendor exceptions
            - Symfony\Component\HttpKernel\Exception\NotFoundHttpException
            - Sylius\Component\Channel\Context\ChannelNotFoundException
            - Symfony\Component\Security\Core\Exception\AccessDeniedException
            - Symfony\Component\Routing\Exception\ResourceNotFoundException
            - ApiPlatform\Symfony\Validator\Exception\ValidationException
            # Domain
            - App\Exception\OutOfStockException
            - App\Exception\InvalidCouponException
            - App\Exception\Api\Address\InvalidBodyException
            - App\Exception\Api\Cart\InvalidCouponCode
            - App\Exception\Api\Cart\InvalidBodyException
            - App\Exception\Api\Cart\EmptyBodyException
services:
    sentry.callback.traces_sampler:
        class: 'App\Services\Sentry\Config'
        factory: [ '@App\Services\Sentry\Config', 'getTracesSampler' ]
    
    # Service declared because Sokeo's YounitedPay plugin does not use autowire / autoconfig
    app.sentry.reporting:
        class: 'App\Services\Sentry\Reporting'
        autowire: true
        autoconfigure: true
