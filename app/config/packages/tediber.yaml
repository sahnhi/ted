tediber:
    ftp:
        Spidy:
            host: '%env(FTP_SPIDY_HOST)%'
            port: 22
            user: '%env(FTP_SPIDY_USER)%'
            password: '%env(FTP_SPIDY_PASSWORD)%'
            has_private_key: false
            directory: '%env(FTP_SPIDY_DIRECTORY)%'
            tracking_path: '%env(FTP_SPIDY_TRACKING_PATH)%'
            delivered_path: '%env(FTP_SPIDY_DELIVERED_PATH)%'
        Vir:
            host: '%env(FTP_VIR_HOST)%'
            port: 22
            user: '%env(FTP_VIR_USER)%'
            password: '%env(FTP_VIR_PASSWORD)%'
            has_private_key: false
