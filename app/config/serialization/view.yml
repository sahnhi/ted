            groups: [ 'product.show', 'product_variant.list', 'pack.show' ]
        price:
            groups: [ 'product.show', 'product_variant.list', 'pack.show' ]
        ecotax:
            groups: [ 'product.show', 'product_variant.list', 'pack.show' ]
        optionValues:
            groups: [ 'product_variant.list', 'pack.show' ]
        optionCodes:
            groups: [ 'product_variant.list', 'pack.show' ]
        optionTranslated:
            groups: [ 'product_variant.list', 'pack.show' ]
        joinStoryLink:
            groups: [ 'product_variant.list' ]


Sylius\Component\Addressing\Model\Country:
