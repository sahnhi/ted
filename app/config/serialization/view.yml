App\View\PackView:
    attributes:
        code:
            groups: [ 'pack.show' ]
        variants:
            groups: [ 'pack.show' ]

App\View\ProductListView:
    attributes:
        items:
            groups: [ 'product.list' ]

App\View\ProductView:
    attributes:
        code:
            groups: [ 'product.list', 'product.show', 'product_review_question.list' ]
        name:
            groups: [ 'product.list', 'product.show', 'product_review_question.list' ]
        slug:
            groups: [ 'product.list', 'product.show', 'product_review_question.list' ]
        averageRating:
            groups: [ 'product.list' ]
        numberOfRating:
            groups: [ 'product.list' ]
        joinStoryLink:
            groups: [ 'product.list', 'product.show' ]
        options:
            groups: [ 'product.show' ]
        variants:
            groups: [ 'product.show' ]
        relatedProducts:
            groups: [ 'product.show' ]

App\View\ProductOptionView:
    attributes:
        code:
            groups: [ 'product.show' ]
        name:
            groups: [ 'product.show' ]
        values:
            groups: [ 'product.show' ]

App\View\ProductOptionValueView:
    attributes:
        code:
            groups: [ 'product.show', 'product_variant.list' ]
        value:
            groups: [ 'product.show', 'product_variant.list' ]
        help:
            groups: [ 'product.show', 'product_variant.list' ]
        description:
            groups: [ 'product.show', 'product_variant.list' ]
        optgroup:
            groups: [ 'product.show', 'product_variant.list' ]

App\View\ProductVariantListView:
    attributes:
        items:
            groups: [ 'product_variant.list' ]

App\View\ProductVariantView:
    attributes:
        code:
            groups: [ 'product.show', 'product_variant.list', 'pack.show' ]
