            expose: true
            type: float
            groups: [ 'product.show', 'product_variant.list', 'pack.show','pack.list', 'taxon.list' ]
        originalPrice:
            expose: true
            type: int
            groups: [ 'product.show', 'product_variant.list', 'pack.show','pack.list', 'taxon.list' ]
        ecotax:
            expose: true
            type: int
            groups: [ 'product.show', 'product_variant.list', 'pack.show','pack.list', 'taxon.list' ]
        optionValues:
            expose: true
            type: array
            groups: [ 'product.show', 'product_variant.list', 'pack.show','pack.list', 'taxon.list' ]
        optionCodes:
            expose: true
            type: array
            groups: [ 'product.show', 'product_variant.list', 'pack.show','pack.list', 'taxon.list' ]
        optionTranslated:
            expose: true
            type: array
            groups: [ 'product.show', 'product_variant.list', 'pack.show','pack.list', 'taxon.list' ]
        packs:
            expose: true
            type: array
            groups: [ 'product.show', 'product_variant.list', 'pack.show','pack.list', 'taxon.list' ]
        product:
            expose: true
            type: string
            groups: [ 'pack.show','pack.list', 'taxon.list' ]
