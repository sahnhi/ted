sylius_grid:
    grids:
        sylius_admin_warehouse:
            driver:
                name: doctrine/orm
                options:
                    class: App\Doctrine\Entity\Warehouse
            fields:
                name:
                    type: string
                    label: sylius.ui.name
                    sortable: translation.name
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
