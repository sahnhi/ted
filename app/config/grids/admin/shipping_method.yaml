sylius_grid:
    grids:
        sylius_admin_shipping_method:
            driver:
                name: doctrine/orm
                options:
                    class: App\Doctrine\Entity\Sylius\ShippingMethod
            fields:
                name:
                    type: string
                    label: sylius.ui.name
                    sortable: translations.name
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
                    serviceRules:
                        type: default
                        label: sylius_admin_service_rules_creation.ui.create
                        icon: 'cart plus'
                        options:
                            link:
                                route: sylius_admin_service_rules_create
                                parameters:
                                    id: resource.id
                            class: orange
            filters:
                search:
                    type: string
                    label: sylius.ui.search
                    options:
                        fields: [ code, translations.name ]

