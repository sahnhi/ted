sylius_grid:
    grids:
        app_rtb_infos:
            driver:
                name: doctrine/orm
                options:
                    class: App\Doctrine\Entity\RtbInfos
            fields:
                label:
                    type: string
                    label: sylius.ui.label
                    sortable: translation.label
                priority:
                    type: string
                    label: sylius.ui.priority
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
