sylius_grid:
    grids:
        sylius_admin_product:
            actions:
                subitem:
                    variants:
                        type: links
                        label: sylius.ui.manage_variants
                        options:
                            resource: resource
                            icon: cubes
                            links:
                                index:
                                    label: sylius.ui.list_variants
                                    icon: list
                                    route: sylius_admin_product_variant_index
                                    parameters:
                                        productId: resource.id
                                create:
                                    label: sylius.ui.create
                                    icon: plus
                                    route: sylius_admin_product_variant_create
                                    condition: isNotEmptyAndDoesNotContainBundle
                                    parameters:
                                        productId: resource.id
                                generate:
                                    label: sylius.ui.generate
                                    icon: random
                                    route: sylius_admin_product_variant_generate
                                    visible: resource.hasOptions
                                    condition: isNotEmptyAndDoesNotContainBundle
                                    parameters:
                                        productId: resource.id
                                generate_bundle:
                                    label: app.ui.bundle_association.labels.generate
                                    icon: plus
                                    route: app_admin_bundle_generation_form
                                    condition: isEmptyOrContainsBundle
                                    parameters:
                                        productId: resource.id
