sylius_grid:
    grids:
        app_admin_shipping_method_category:
            driver:
                name: doctrine/orm
                options:
                    class: App\Doctrine\Entity\ShippingMethodCategory
            filters:
                code:
                    type: string
                    label: sylius.ui.code
                enabled:
                    type: boolean
                    label: sylius.ui.enabled
                contains_shipping_method:
                    type: entity
                    label: app.ui.shipping_method_category.filters.contains_shipping_method
                    options:
                        fields: [ shippingMethods.id ]
                    form_options:
                        class: "%sylius.model.shipping_method.class%"
            fields:
                code:
                    type: string
                    label: sylius.ui.code
                    sortable: code
                name:
                    type: string
                    label: sylius.ui.name
                shippingMethods:
                    type: twig
                    label: sylius.ui.shipping_methods
                    options:
                        template: 'Admin/ShippingMethodCategory/Grid/Field/shipping_methods.html.twig'
                enabled:
                    type: twig
                    label: sylius.ui.enabled
                    options:
                        template: "@SyliusUi/Grid/Field/enabled.html.twig"
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
