sylius_grid:
    grids:
        sylius_admin_pack:
            driver:
                name: doctrine/orm
                options:
                    class: App\Doctrine\Entity\Pack
            sorting:
                code: asc
            fields:
                name:
                    type: string
                    label: sylius.ui.name
                    sortable: translation.name
                code:
                    type: string
                    label: sylius.ui.code
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
            filters:
                search:
                    type: string
                    label: sylius.ui.search
                    options:
                        fields: [ code, translations.name ]
