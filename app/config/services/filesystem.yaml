    App\Services\Filesystem\GoogleStorageQualityImageFilesystem:
        arguments:
            $filesystemStorage: !service { class: Gaufrette\Filesystem, arguments: [ '%app.google_storage_quality_image.filesystem%' ], factory: [ '@knp_gaufrette.filesystem_map', get ] }
            $filesystemLocal: !service { class: Gaufrette\Filesystem, arguments: [ '%app.local.filesystem%' ], factory: [ '@knp_gaufrette.filesystem_map', get ] }

    App\Services\Filesystem\GoogleStorageRssReviewFilesystem:
        arguments:
            $filesystemStorage: !service { class: Gaufrette\Filesystem, arguments: [ '%app.google_storage_generic.filesystem%' ], factory: [ '@knp_gaufrette.filesystem_map', get ] }
            $filesystemLocal: !service { class: Gaufrette\Filesystem, arguments: [ '%app.local.filesystem%' ], factory: [ '@knp_gaufrette.filesystem_map', get ] }

    App\Services\Filesystem\GoogleStorageExportFileSystem:
        arguments:
            $filesystemStorage: !service { class: Gaufrette\Filesystem, arguments: [ '%app.google_storage_export.filesystem%' ], factory: [ '@knp_gaufrette.filesystem_map', get ] }
            $filesystemLocal: !service { class: Gaufrette\Filesystem, arguments: [ '%app.local.filesystem%' ], factory: [ '@knp_gaufrette.filesystem_map', get ] }

    App\Services\Filesystem\GoogleStorageExportReviewFilesystem:
