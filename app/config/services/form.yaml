    ## Only needed because of this test Unit/Controller/Admin/Action/BisCreationWithExchangeActionTest.php
    ## Find a way to remove that
    App\Form\Extension\ShippingMethodTranslationExtension:
        tags:
            - {
                  name: form.type_extension,
                  extended_type: Sylius\Bundle\ShippingBundle\Form\Type\ShippingMethodTranslationType,
              }

    app.form.type.data_transformer.variants_to_codes:
        class: App\Form\DataTransformer\CodeAwareToCodesTransformer
