    App\Form\Type\ShipmentType:
        tags:
            - { name: "form.type" }
        arguments:
            $validationGroups: "%sylius.form.type.shipment.validation_groups%"

    App\Form\Type\OrderItemType:
        tags:
            - { name: "form.type" }
        arguments:
            $dataMapper: "@sylius.form.data_mapper.order_item_quantity"
            $validationGroups: "%sylius.form.type.order.validation_groups%"

    App\Form\Type\Order\BisExchangeOrderItemType:
        tags:
            - { name: "form.type" }
        arguments:
            $dataMapper: "@sylius.form.data_mapper.order_item_quantity"
