services:
    # Default configuration for services in *this* file
    _defaults:
        # Automatically injects dependencies in your services
        autowire: true

        # Automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true

        # Allows optimizing the container by removing unused services; this also means
        # fetching services directly from the container via $container->get() won't work
        public: false

    # Makes classes in src/ available to be used as services;
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../../src/*'
        exclude:
            - '../../src/{Tests,Twig,Validator,Kernel.php,Registry/FtpConfigurationRegistry.php,Registry/EmailConfigurationRegistry.php}'
            - '../../src/Doctrine/{Entity,Migrations,Repository}'

    # Controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../../src/Controller/*'
        public: true
        tags: [ 'controller.service_arguments' ]
    
    # Commands
    App\Command\:
        resource: '../../src/Command/*'
        public: true
        tags: { name: console.command }
    
    # Form types
    App\Form\Type\:
        resource: '../../src/Form/Type/*'
        public: true
        tags: { name: form.type }
    
    # Form extensions
    App\Form\Extension\:
        resource: '../../src/Form/Extension/*'
        public: true
        tags: { name: form.type_extension }

    app.export_accounting_data_exporter:
        alias: 'App\Exporter\ExportAccountingDataExporter'
        public: true

    App\EventListener\ExportAccountingDataNotifier:
        tags: 
            -
                name: 'doctrine.event_listener' 
                event: postPersist
                arguments: 'App\Doctrine\Entity\ExportAccountingData'
