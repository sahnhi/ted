services:
    product.filter:
        parent: 'api_platform.doctrine.orm.search_filter'
        arguments: [{code: exact, translations.slug: exact}]
        tags: ['api_platform.filter']
    
    app.api.taxon_slug_filter:
        parent: 'api_platform.doctrine.orm.search_filter'
        arguments:
            - { translations.slug: exact }
        tags:
            - { name: 'api_platform.filter' }

    app.api.product_review_rating_filter:
        parent: 'api_platform.doctrine.orm.search_filter'
        arguments:
            - { rating: exact }
        tags:
            - { name: 'api_platform.filter' }

    app.api.product_variant_enabled_filter:
        parent: 'api_platform.doctrine.orm.boolean_filter'
        arguments: [ { enabled: ~ } ]
        tags:
            - { name: 'api_platform.filter' }
