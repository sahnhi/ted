shop_api_product_list:
    path: /products
    methods: [ GET ]
    defaults:
        _controller: App\Controller\Api\Product\ListAction

shop_api_product_show:
    path: /products/{code}
    methods: [ GET ]
    defaults:
        _controller: App\Controller\Api\Product\ShowAction

show_api_product_variant_list_per_options:
    path: /products/{productCode}/variants
    methods: [ POST ]
    defaults:
        _controller: App\Controller\Api\Product\Variant\ListPerOptionsAction

shop_api_product_review_list:
    path: /products/{code}/reviews
    methods: [ GET ]
    defaults:
        _controller: App\Controller\Api\Product\Review\ListAction

shop_api_product_dimensions:
    path: /products/{codes}/dimensions
    methods: [ GET ]
    defaults:
        _controller: App\Controller\Api\Product\DimensionAction
