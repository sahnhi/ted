shop_api_erp_product_availability:
    path: /product/availability/{variantCode}
    methods: [ GET ]
    defaults:
        _controller: App\Controller\Api\Erp\ProductAvailabilityAction

shop_api_erp_calendar_availability:
    path: /calendar
    methods: [ POST ]
    defaults:
        _controller: App\Controller\Api\Calendar\CalendarAvailabilityAction
