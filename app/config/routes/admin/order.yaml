sylius_admin_order_export:
    path: /orders/export/{export}
    methods: [ GET ]
    defaults:
        _controller: sylius.controller.order:indexAction

sylius_admin_order_out_of_stock:
    path: /orders/bulk/out_of_stock
    methods: [ POST ]
    defaults:
        _controller: sylius.controller.order:outOfStockAction
        _sylius:
            repository:
                method: findById
                arguments: [ $ids ]

sylius_admin_order_show_custom:
    path: /orders/{id}
    methods: [ GET, POST ]
    defaults:
        _controller: sylius.controller.order:showAction
        _sylius:
            section: admin
            permission: true
            template: 'bundles/SyliusAdminBundle/Order/show.html.twig'

sylius_admin_order_creation_return:
    path: /orders/{id}/return
    methods: [ GET ]
    options:
        expose: true
    defaults:
        _controller: sylius.controller.order:createAction
        _sylius:
            event: admin_create
            section: admin
            permission: true
            template: '@App/Admin/Order/create.html.twig'
            form:
                type: App\Form\Type\NewOrderType
                options:
                    attr:
                        returnType: simple
                    constraints:
                        order_type: return
            factory:
                method: [ 'expr:service("Sylius\\AdminOrderCreationPlugin\\Factory\\OrderFactory")', 'createReorder' ]
                arguments: [ "expr:service('sylius.repository.order').find($id)", "return", "simple" ]

