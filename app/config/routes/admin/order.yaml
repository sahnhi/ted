sylius_invoicing_plugin_admin_invoice_resend:
    path: /invoices/{id}/resend
    methods: [ GET ]
    defaults:
        _controller: App\Controller\Admin\Action\ResendInvoiceAction

app_admin_order_shipment_delivery_date:
    path: /orders/{id}/delivery_date
    methods: [ GET, PUT ]
    defaults:
        _controller: sylius.controller.shipment:updateAction
        _sylius:
            repository:
                method: findOneByOrderId
                arguments:
                    id: $id
                    orderId: $orderId
            redirect: referer
            section: admin
            permission: true
            template: "@SyliusAdmin/Order/update_shipment_delivery_date.html.twig"
            form: App\Form\Type\ShipmentDeliveryDateType
            vars:
                route:
                    parameters:
                        orderId: $orderId
                        id: $id

sylius_confirmation_email_resend:
    path: /order/{token}/confirmation/resend
    methods: [ GET ]
    defaults:
        _controller: App\Controller\Admin\Action\ResendConfirmationEmailAction

sylius_switch_to_vip:
    path: /order/{id}/vip/{create}
    methods: [ GET ]
    defaults:
        _controller: App\Controller\Admin\Action\SwitchOrderToVIPAction

sylius_admin_order_cancel:
    path: /orders/{id}/cancel
    methods: [ PUT, POST ]
    defaults:
        _controller: sylius.controller.order:cancelAction
        _sylius:
            section: admin
            permission: true
            template: "@SyliusAdmin/Order/cancel.html.twig"
            state_machine:
                graph: sylius_order
                transition: cancel

sylius_admin_order_history:
    path: /orders/{id}/history
    methods: [ GET ]
    defaults:
        _controller: sylius.controller.order:historyAction
        _sylius:
            section: admin
            permission: true
            template: "@SyliusAdmin/Order/history.html.twig"

app_admin_order_update_customer:
    path: /orders/{id}/update-customer
    methods: [ GET, PUT ]
    defaults:
        _controller: sylius.controller.order:updateAction
        _sylius:
            repository:
                method: find
                arguments:
                    id: $id
            redirect: referer
            section: admin
            permission: true
            template: "@SyliusAdmin/Order/update_customer.html.twig"
            form: App\Form\Type\Order\OrderUpdateCustomerType
            vars:
                route:
                    parameters:
                        id: $id

app_admin_order_bis_creation_with_exchange:
    path: /order/bis-create/exchange
    methods: [ POST ]
    defaults:
        _controller: App\Controller\Admin\Action\BisCreationWithExchangeAction

app_admin_order_item_logistic_generate:
    path: /order/{id}/generate-order-item-logistic
    methods: [ GET ]
    defaults:
        _controller: App\Controller\Admin\Action\GenerateOrderItemLogisticAction

app_admin_order_payments_index:
    path: /order-payments/
    methods: [ GET ]
    defaults:
        _controller: sylius.controller.order::indexAction
        _sylius:
            grid: sylius_admin_order_payments
            template: '@SyliusAdmin/Crud/index.html.twig'
            vars:
                header: sylius.ui.orders
                subheader: app.ui.order_payements.sub_header
