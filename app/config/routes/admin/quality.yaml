app_admin_quality:
    resource: |
        alias: app.quality
        section: admin
        templates: "@SyliusAdmin\\Crud"
        redirect: update
        grid: app_admin_quality
        except: [ 'create', 'update', 'show' ]
        vars:
            all:
                subheader: app.ui.quality.subheader
            index:
                icon: 'file image outline'
    type: sylius.resource

app_admin_quality_create:
    path: /qualities/new/{orderId}
    methods: [GET, POST]
    defaults:
        _controller: app.controller.quality:createAction
        _sylius:
            section: admin
            factory:
                method: createFromOrder
                arguments: [$orderId]
            template: "@App/Admin/Quality/create.html.twig"
            form:
                options:
                    order: "expr:service('sylius.repository.order').find($orderId)"
            vars:
                order: "expr:service('sylius.repository.order').find($orderId)"
                route:
                    parameters:
                        orderId: $orderId

app_export_quality_csv:
    path: /qualities/export-csv
    methods: [GET]
    defaults:
        _controller: app.controller.quality:exportCsvAction
        _sylius:
            grid: app_admin_quality
            section: admin

app_admin_quality_update:
    path: /qualities/{id}/edit
    methods: [GET, PUT, PATCH]
    defaults:
        _controller: app.controller.quality:updateAction
        _sylius:
            section: admin
            template: "@App/Admin/Quality/update.html.twig"
            form:
                type: App\Form\Type\Quality\UpdateType
                options:
                    order: "expr:service('sylius.repository.order').findForQualityId($id)"
            vars:
                order: "expr:service('sylius.repository.order').findForQualityId($id)"

app_admin_quality_show:
    path: /qualities/{id}
    methods: [GET]
    defaults:
        _controller: app.controller.quality:updateAction
        _sylius:
            section: admin
            template: "@App/Admin/Quality/update.html.twig"
            form:
                type: App\Form\Type\Quality\UpdateType
                options:
                    order: "expr:service('sylius.repository.order').findForQualityId($id)"
            vars:
                order: "expr:service('sylius.repository.order').findForQualityId($id)"

app_admin_quality_image_download:
    path: /qualities/{id}/download/{image}
    methods: [GET]
    defaults:
        _controller: App\Controller\Admin\Quality\DownloadImageAction
