sylius_admin_order_return:
    resource: |
        alias: sylius.order_return
        section: admin
        templates: SyliusAdminBundle:Crud
        redirect: index
        grid: sylius_admin_order_return
        vars:
            all:
                subheader: sylius.form.order_return.information
                templates:
                    form: "@App/OrderReturn/_form.html.twig"
            index:
                icon: 'file image outline'
    type: sylius.resource

sylius_admin_order_return_export:
    path: /order-returns/export/{export}
    methods: [ GET ]
    defaults:
        _controller: sylius.controller.order:indexAction
        _sylius:
            section: admin
            permission: true
            template: "SyliusAdminBundle:Crud:index.html.twig"
            grid: sylius_admin_order_return
