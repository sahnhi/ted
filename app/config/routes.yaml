sylius_admin_ajax_variant_by_name_phrase:
    path: /admin/ajax/variant/search
    methods: [GET]
    defaults:
        _controller: sylius.controller.product_variant:indexAction
        _format: json
        _sylius:
            serialization_groups: [Autocomplete]
            permission: true
            repository:
                method: findByNamePart
                arguments:
                    phrase: $phrase
                    locale: expr:service('sylius.context.locale').getLocaleCode()
                    user: expr:service('security.token_storage').getToken().getUser()

sylius_admin_ajax_variant_by_name_phrase_no_return:
    path: /admin/ajax/variant_no_return/search
    methods: [GET]
    defaults:
        _controller: sylius.controller.product_variant:indexAction
        _format: json
        _sylius:
            serialization_groups: [Autocomplete]
            permission: true
            repository:
                method: findByNamePartNoReturn
                arguments:
                    phrase: $phrase
                    locale: expr:service('sylius.context.locale').getLocaleCode()
                    user: expr:service('security.token_storage').getToken().getUser()

sylius_admin_ajax_variant_by_name_phrase_and_channel:
    path: /admin/ajax/variant/search/{$channelCode}
    methods: [GET]
    defaults:
        _controller: sylius.controller.product_variant:indexAction
        _format: json
        _sylius:
            serialization_groups: [Autocomplete]
            permission: true
            repository:
                method: findByNamePartAndChannel
                arguments:
                    phrase: $phrase
                    locale: expr:service('sylius.context.locale').getLocaleCode()
                    user: expr:service('security.token_storage').getToken().getUser()
                    channelCode: $channelCode

sylius_admin_ajax_variant_by_code:
    path: /admin/ajax/variant/code
    methods: [GET]
    defaults:
        _controller: sylius.controller.product_variant:indexAction
        _format: json
        _sylius:
            serialization_groups: [Autocomplete]
            permission: true
            repository:
                method: findBy
                arguments: [code: $code]

sylius_admin_order_creation_customer_create:
    path: /admin/orders/new/customer/{customerEmail}/{customerFirstName}/{customerLastName}/{channelCode}
    methods: [GET]
    options:
        expose: true
    defaults:
        _controller: App\Controller\Admin\CustomerCreationAction

sylius_admin_order_creation_bis:
    path: /admin/orders/{id}/bis
    methods: [GET]
    options:
        expose: true
    defaults:
        _controller: sylius.controller.order:createAction
        _sylius:
            event: admin_create
            section: admin
            permission: true
            template: "@App/Admin/Order/create.html.twig"
            form:
                type: App\Form\Type\NewOrderType
                options:
                    constraints:
                        order_type: bis
                        order_parent_id: $id
            factory:
                method:
                  [
                      'expr:service("Sylius\\AdminOrderCreationPlugin\\Factory\\OrderFactory")',
                      "createReorder",
                  ]
                arguments:
                  ["expr:service('sylius.repository.order').find($id)", "bis"]

sylius_admin_order_creation_order_preview:
    path: /admin/orders/new/{customerId}/{channelCode}/preview
    methods: [POST]
    defaults:
        _controller: App\Controller\Admin\OrderPreviewAction
        _sylius:
            form:
                type: App\Form\Type\NewOrderType
            factory:
                method:
                  [
                      'expr:service("Sylius\\AdminOrderCreationPlugin\\Factory\\OrderFactory")',
                      "createForCustomerAndChannel",
                  ]
                arguments: [$customerId, $channelCode]

sylius_admin_order_creation_order_create:
    path: /admin/orders/new/{customerId}/{channelCode}
    methods: [GET]
    options:
        expose: true
    defaults:
        _controller: sylius.controller.order:createAction
        _sylius:
            event: admin_create
            section: admin
            permission: true
            template: "@App/Admin/Order/create.html.twig"
            form:
                type: App\Form\Type\NewOrderType
            factory:
                method:
                  [
                      'expr:service("Sylius\\AdminOrderCreationPlugin\\Factory\\OrderFactory")',
                      "createForCustomerAndChannel",
                  ]
                arguments: [$customerId, $channelCode]
    requirements:
        customerEmail: .+

sylius_admin_order_creation_order_create_from_preview:
    path: /admin/orders/new/{customerId}/{channelCode}/create-from-preview
    methods: [POST]
    options:
        expose: true
    defaults:
        _controller: sylius.controller.order:createAction
        _sylius:
            event: admin_create
            section: admin
            permission: true
            template: "@SyliusAdminOrderCreationPlugin/Order/preview.html.twig"
            form:
                type: App\Form\Type\NewOrderType
            factory:
                method:
                  [
                      'expr:service("Sylius\\AdminOrderCreationPlugin\\Factory\\OrderFactory")',
                      "createForCustomerAndChannel",
                  ]
                arguments: [$customerId, $channelCode]

sylius_payment_callback_dalenys:
