app_admin_product_feed_file_importer:
    resource: |
        alias: app.product_feed_file_importer
        section: admin
        templates: "@SyliusAdmin\\Crud"
        redirect: index
        grid: app_admin_product_feed_file_importer
        vars:
            all:
                subheader: app.ui.product_feed_file_importer
            index:
                icon: 'file image outline'
    type: sylius.resource
    prefix: /admin

app_admin_product_feed_file_importer_form:
    path: /admin/product-feed-file-importer/file-import-form
    controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
    defaults:
        template: "@SyliusAdmin/ProductFeedFile/Form/ImportFile/import_file_form.html.twig"
        maxAge: 86400
        sharedMaxAge: 86400
        private: true

