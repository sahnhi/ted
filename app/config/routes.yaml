app_shop_partial_product_index_ordered_by_taxon_code:
    path: /ordered/{code}
    methods: [GET]
    defaults:
        _controller: sylius.controller.product:indexAction
        _sylius:
            template: $template
            repository:
                method: findOrderedByChannelAndTaxonCode
                arguments:
                    - "expr:service('sylius.context.channel').getChannel()"
                    - "expr:service('sylius.context.locale').getLocaleCode()"
                    - $code

