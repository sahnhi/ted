services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:            
            $apiKey: "%sylius_odoo_api_key%"

    App\Api\Odoo\Controller\:
        resource: '../../Controller/*'
        tags: ['controller.service_arguments']
        public: true

    App\Api\Odoo\Action\:
        resource: '../../Action/*'
        tags: ['controller.service_arguments']
        public: true
