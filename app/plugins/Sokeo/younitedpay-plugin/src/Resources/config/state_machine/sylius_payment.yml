                #     do: ["@sokeo_sylius_younitedpay_plugin.state_machine.get_maturities_processor", "getMaturities"]
                #     args: ["object"]
    sylius_order_shipping:
        callbacks:
            before:
                sokeo_sylius_younitedpay_plugin_shipped:
                    on: [ "deliver" ]
                    do: [ "@sokeo_sylius_younitedpay_plugin.state_machine.activate_contract_processor", "activate" ]
                    args: [ "object" ]
