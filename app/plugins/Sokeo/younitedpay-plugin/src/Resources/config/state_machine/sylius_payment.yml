winzou_state_machine:
    sylius_order_checkout:
        callbacks:
            before:
                sokeo_sylius_younitedpay_plugin_store_maturity:
                    on: ["select_payment"]
                    do: ["@sokeo_sylius_younitedpay_plugin.state_machine.store_maturity_processor", "setDetails"]
                    args: ["object"]
